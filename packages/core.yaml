  # header_bar.GLYPHS in the add-on sends: every printable ASCII character (firmware 0.36.0+, "bbno$" in GitHub #147)
  # and the letters European languages write with. Roboto has no heart, so ♡, ♥ and ❤ come from
  # NotoSansSymbols2-hearts.ttf (OFL): Noto Sans Symbols 2 cut to those three with fontTools' pyftsubset, its U+2764 given
  # the U+2665 heart, as Noto's own is a squat one lying on its side. tools/profiles.py glyphs() reads both lists.
