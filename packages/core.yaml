# Make memory visible: this board has no PSRAM, so the free heap determines
# how much UI still fits. Also shows up as an entity in Home Assistant.
debug:
  # Heap figures every five minutes: enough to spot a leak, few recorder rows.
  update_interval: 300s

sensor:
  - platform: debug
    free:
      name: "Heap Free"
      id: heap_free
      on_value:
        - lambda: |-
            ESP_LOGI("health", "free_heap=%.0f", x);
            #ifdef USE_ESP32
            // The part of it a byte-wise malloc can use (firmware 0.34.0+): on the classic ESP32 the figure above also
            // counts IRAM that takes 32-bit words only. The tile budget and LVGL's own buffers live on this one.
            // `room=measuring` until a layout has settled (firmware 0.51.0).
            if (runtime_tiles::memory_known(esphome::millis()))
              ESP_LOGI("health", "free_8bit=%u room=%u", (unsigned) heap_caps_get_free_size(MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT),
                       (unsigned) runtime_tiles::memory_room(esphome::millis()));
            else
              ESP_LOGI("health", "free_8bit=%u room=measuring", (unsigned) heap_caps_get_free_size(MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT));
            // The least stack the loop task (LVGL, the tiles, the API) ever had left since boot: a layout replacement
            // runs deepest. loop_task_stack_size in hardware/esp-idf.yaml is sized from this line (firmware 0.3.1+).
            ESP_LOGI("health", "loop_stack_min_free=%u", (unsigned) uxTaskGetStackHighWaterMark(nullptr));
            // Pages kept whole and pictures kept (firmware 0.3.2+): what they hold, and the PSRAM left beside them.
            ESP_LOGI("health", "kept_pages=%u pictures=%u B psram_free=%u", runtime_tiles::kept_count(),
                     (unsigned) runtime_tiles::pictures.size(), (unsigned) heap_caps_get_free_size(MALLOC_CAP_SPIRAM));
            #endif
    fragmentation:
      name: "Heap Fragmentation"
    block:
      name: "Heap Largest Block"
      on_value:
        - lambda: 'ESP_LOGI("health", "largest_block=%.0f", x);'
    # The lowest free heap since boot: what the busiest moment (boot sync, a swipe) left over.
    min_free:
      name: "Heap Minimum Free"
      on_value:
        - lambda: 'ESP_LOGI("health", "min_free=%.0f", x);'
  # The other half of the memory (firmware 0.2.83+). The four figures above are ESPHome's debug platform, and on
  # an ESP32 all four read MALLOC_CAP_INTERNAL: the memory inside the chip, which is what the Wi-Fi link, the API
  # and LVGL live on. A picture is allocated with ESPHome's RAMAllocator, which prefers that same memory and only
  # falls back to PSRAM when the block does not fit, so a board's picture sizes follow from both halves and not
  # from how much PSRAM it has. These two say what the other half holds; a board without PSRAM reports zero.
  - platform: template
    name: "Psram Free"
    id: psram_free
    unit_of_measurement: B
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 300s
    lambda: |-
      #ifdef USE_ESP32
        return heap_caps_get_free_size(MALLOC_CAP_SPIRAM);
      #else
        return 0;
      #endif
  # A picture needs one block, not a total: 2 MB free in ten pieces holds no 2 MB picture.
  # Read only while the glass is dark (firmware 0.3.2+): finding the largest block walks the whole PSRAM heap with its
  # lock held and this core's interrupts off, 1.7 to 2.3 ms on the 4-inch Guition, and an RGB panel refills its bounce
  # buffer from an interrupt every 0.34 ms. Once every five minutes a lit screen showed a shifted frame; a dark one
  # shows nothing, so the figure waits for standby at level 0 or Sleep and keeps its last value until then.
  - platform: template
    name: "Psram Largest Block"
    id: psram_largest
    unit_of_measurement: B
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 300s
    lambda: |-
      #ifdef USE_ESP32
        if (!heap_caps_get_total_size(MALLOC_CAP_SPIRAM)) return 0;
        if (!id(display_dimmed) || runtime_tiles::standby_level() != 0) return {};
        return heap_caps_get_largest_free_block(MALLOC_CAP_SPIRAM);
      #else
        return 0;
      #endif
  - platform: wifi_signal
    name: "Wifi Signal"
    update_interval: 600s

  # When the screen booted, as a timestamp: one value per boot instead of a new recorder
  # row every 15 s. A new entity on purpose: Home Assistant keeps the old Uptime's unit
  # "s" in its registry and would refuse a timestamp under that name.
  - platform: uptime
    type: timestamp
    name: "Last boot"
    id: boot_time


binary_sensor:
  - platform: status
    name: "Node Status"
    id: system_status

# ----------------------------------------------------------
# Text sensors
#
# smartdisplay_action:
# - Main touch event channel exported to Home Assistant
# - On short tap, publishes one of:
#     tile1_press / tile2_press / tile3_press / tile4_press / tile5_press / tile6_press
# - The value is reset shortly after publishing
#
# tile*_preset:
# - Mirrors the Home Assistant preset_mode attribute for each tile entity
# - Used by the UI to display fan presets when applicable
# ----------------------------------------------------------
text_sensor:
  - platform: template
    name: "Screen firmware"
    entity_category: diagnostic
    lambda: 'return {"${SCREEN_FIRMWARE_VERSION}"};'
    update_interval: 60s
  # The shape of this screen (firmware 0.2.80+): the canvas LVGL draws on, the grid of cells a page holds, the
  # pixel density and the look ("800x480 3x3 217dpi standard"), so ESP Screens knows what a screen looks like
  # instead of guessing from the board it was built for (core.parse_shape reads it). The canvas follows the
  # rotation, which is why it is read from the display and not from the board file.
  - platform: template
    id: screen_layout
    name: "Screen layout"
    entity_category: diagnostic
    lambda: |-
      char text[48];
      auto *display = lv_display_get_default();
      snprintf(text, sizeof(text), "%dx%d %dx%d %ddpi %s", (int) lv_display_get_horizontal_resolution(display),
               (int) lv_display_get_vertical_resolution(display), (int) runtime_tiles::grid.columns, (int) runtime_tiles::grid.rows,
               ui::dpi, ui::large() ? "standard" : "compact");
      return {std::string(text)};
    update_interval: 60s
  # Which board this is (firmware 0.2.80): the key of its file in packages/boards, so ESP Screens knows what a
  # screen can do without a sensor per board. It used to read a "Guition screen type" sensor that only the
  # Guition had, so every other board was "unknown" and camera tiles were refused on all of them.
  - platform: template
    name: "Screen board"
    entity_category: diagnostic
    lambda: 'return {"${BOARD_ID}"};'
    update_interval: 60s
  # What this screen is able to do (firmware 0.2.99+): the words of settings_screen::features(), which is where the
  # list of abilities lives. ESP Screens used to read these facts from a table it keeps per board (boards.json),
  # which is right until a board is changed: a Waveshare whose backlight was rewired to a PWM pin
  # (docs/WAVESHARE7.md) really does dim, and the table would keep saying it cannot. So the screen says it itself,
  # and the app falls back to the table only for firmware from before this sensor and for a screen that is offline.
  # docs/ADDING_A_BOARD.md says how an ability is added.
  - platform: template
    name: "Screen features"
    entity_category: diagnostic
    lambda: 'return {settings_screen::features()};'
    update_interval: 60s
  # The language this firmware was built in (0.2.90+): ESP Screens offers an update when it differs from the chosen one.
  - platform: template
    name: "Screen language"
    entity_category: diagnostic
    lambda: 'return {screen_text::LANGUAGE};'
    update_interval: 60s
  # ESP Screen Manager matches the screen to its YAML profile and OTA address.
  - platform: template
    name: "Device name"
    entity_category: diagnostic
    lambda: 'return {"${DEVICE_NAME}"};'
    update_interval: 60s
  - platform: wifi_info
    ip_address:
      # `id` so the settings page on the screen can show the same address (0.2.44+).
      id: wifi_ip
      name: "IP address"
      entity_category: diagnostic

# Turning the screen as a Home Assistant choice (firmware 0.2.80+). Every screen offers the half turn, which keeps
# its canvas and its grid; square glass the quarter turns as well, whose canvas is the same either way
# (settings_screen::quarter_turns in on_boot). The screen applies the angle on top of the way it hangs
# (runtime_tiles::base_turn: LVGL_ROTATION, or the way ESP Screens stood it up or laid it down).
select:
  - platform: template
    id: setting_rotation
    name: "Rotation"
    icon: "mdi:screen-rotation"
    entity_category: config
    options: ${ ["0°", "90°", "180°", "270°"] if PANEL_W == PANEL_H else ["0°", "180°"] }
    update_interval: never
    lambda: 'return std::to_string(settings_screen::rotation) + "°";'
    set_action:
      - lambda: |-
          const std::string option(x.c_str(), x.size());
          settings_screen::set("rotation", atoi(option.c_str()));

# The touch panel the board names (`id: ts_touch`) turns with the display, through LVGL; these say how the
# panel's own axes lie against the display's pixels.
touchscreen:
  - id: !extend ts_touch
    transform:
      swap_xy: ${TOUCH_SWAP_XY}
      mirror_x: ${TOUCH_MIRROR_X}
      mirror_y: ${TOUCH_MIRROR_Y}

switch:
  - platform: restart
    name: "Restart"
  # The screen settings as Home Assistant entities (firmware 0.2.49+, Auto standby since 0.2.41). The screen
  # owns them: the settings page, these entities and ESP Screens all change them through
  # settings_screen::set(), which saves, applies and reports a real change only. The saved values keep
  # their preference records. A template switch reads its lambda every loop and publishes a change itself;
  # the numbers and times are published by apply_screen_settings. Auto standby off wakes a screen the
  # standby time dimmed (a Sleep holds until a tap, Wake or an alert); on counts the standby time from that
  # moment. Nothing runs at boot: every switch follows the saved setting.
  - platform: template
    id: setting_auto_standby
    name: "Auto standby"
    icon: "mdi:sleep"
    entity_category: config
    restore_mode: DISABLED
    lambda: return screen_settings::current.standby_enabled;
    turn_on_action:
      - lambda: |-
          id(last_touch_ms) = millis();
          settings_screen::set("standby_enabled", 1);
    turn_off_action:
      - lambda: 'settings_screen::set("standby_enabled", 0);'
  - platform: template
    id: setting_night_mode
    name: "Night mode"
    icon: "mdi:weather-night"
    entity_category: config
    restore_mode: DISABLED
    lambda: return screen_settings::current.night_enabled;
    turn_on_action:
      - lambda: 'settings_screen::set("night_enabled", 1);'
    turn_off_action:
      - lambda: 'settings_screen::set("night_enabled", 0);'
  # The dark look for a screen beside a bed (firmware 0.2.54+): black page, graphite cards, soft white text.
  - platform: template
    id: setting_dark_mode
    name: "Dark mode"
    icon: "mdi:theme-light-dark"
    entity_category: config
    restore_mode: DISABLED
    lambda: return settings_screen::dark_mode != 0;
    turn_on_action:
      - lambda: 'settings_screen::set("dark_mode", 1);'
    turn_off_action:
      - lambda: 'settings_screen::set("dark_mode", 0);'
  - platform: template
    id: setting_auto_home
    name: "Back to page 1"
    icon: "mdi:home-import-outline"
    entity_category: config
    restore_mode: DISABLED
    lambda: return settings_screen::auto_home != 0;
    turn_on_action:
      - lambda: 'settings_screen::set("auto_home", 1);'
    turn_off_action:
      - lambda: 'settings_screen::set("auto_home", 0);'
  - platform: template
    id: setting_home_on_standby
    name: "Back to page 1 on standby"
    icon: "mdi:home-import-outline"
    entity_category: config
    restore_mode: DISABLED
    lambda: return screen_settings::current.home_on_standby;
    turn_on_action:
      - lambda: 'settings_screen::set("home_on_standby", 1);'
    turn_off_action:
      - lambda: 'settings_screen::set("home_on_standby", 0);'
  # Debug mode: the whole log while on, warnings and errors alone while off (settings_screen.h says why). Beside the
  # screen's other diagnostics in Home Assistant; the same value as the row under This screen on the glass.
  - platform: template
    id: setting_debug_mode
    name: "Debug mode"
    icon: "mdi:bug-outline"
    entity_category: diagnostic
    restore_mode: DISABLED
    lambda: return settings_screen::debug_mode != 0;
    turn_on_action:
      - lambda: 'settings_screen::set_debug_mode(1);'
    turn_off_action:
      - lambda: 'settings_screen::set_debug_mode(0);'
  - platform: template
    id: setting_swipe_pages
    name: "Swipe between pages"
    icon: "mdi:gesture-swipe-horizontal"
    entity_category: config
    restore_mode: DISABLED
    lambda: return settings_screen::swipe_pages != 0;
    turn_on_action:
      - lambda: 'settings_screen::set("swipe_pages", 1);'
    turn_off_action:
      - lambda: 'settings_screen::set("swipe_pages", 0);'
  # Off, the Previous and Next bar under the tiles goes and the tiles take its room (firmware 0.2.69+).
  - platform: template
    id: setting_page_buttons
    name: "Page buttons"
    icon: "mdi:page-next-outline"
    entity_category: config
    restore_mode: DISABLED
    lambda: return settings_screen::page_buttons != 0;
    turn_on_action:
      - lambda: 'settings_screen::set("page_buttons", 1);'
    turn_off_action:
      - lambda: 'settings_screen::set("page_buttons", 0);'
  # The house at the far left returns to the configured Home page (firmware 0.3.0+).
  # A detail page with hidden bottom navigation uses this position for Back, even when Home is disabled.
  - platform: template
    id: setting_home_button
    name: "Show home button"
    icon: "mdi:home"
    entity_category: config
    restore_mode: DISABLED
    lambda: return settings_screen::home_button != 0;
    turn_on_action:
      - lambda: 'settings_screen::set("home_button", 1);'
    turn_off_action:
      - lambda: 'settings_screen::set("home_button", 0);'

# Night hours as Home Assistant times (firmware 0.2.49+); the screen keeps minutes since midnight.
datetime:
  - platform: template
    type: time
    id: setting_night_start
    name: "Night starts"
    icon: "mdi:weather-sunset-down"
    entity_category: config
    update_interval: never
    lambda: |-
      ESPTime time{};
      time.hour = screen_settings::current.night_start / 60;
      time.minute = screen_settings::current.night_start % 60;
      return time;
    set_action:
      - lambda: 'settings_screen::set("night_start", x.hour * 60 + x.minute);'
  - platform: template
    type: time
    id: setting_night_end
    name: "Night ends"
    icon: "mdi:weather-sunset-up"
    entity_category: config
    update_interval: never
    lambda: |-
      ESPTime time{};
      time.hour = screen_settings::current.night_end / 60;
      time.minute = screen_settings::current.night_end % 60;
      return time;
    set_action:
      - lambda: 'settings_screen::set("night_end", x.hour * 60 + x.minute);'

lvgl:
  id: screen_lvgl
  # LVGL's own warnings stay out of the firmware (firmware 0.3.1): about 6 KB on the CYD, whose flash is the tightest.
  # Errors are still logged, and the firmware's own lines (health, ui_test, touch) are ESPHome's logger, not LVGL's.
  log_level: ERROR
  # The theme's font for text without a font of its own. Every label names its font, so this only keeps
  # ESPHome from building LVGL's Montserrat 14 for nothing (firmware 0.2.65+).
  default_font: ${LVGL_DEFAULT_FONT}
  on_draw_start:
    - lambda: 'id(rendered_frames)++;'
  displays:
    - my_display
  touchscreens:
    - touchscreen_id: ts_touch

  buffer_size: ${LVGL_BUFFER_SIZE}

  # Direct local feedback on the WHOLE UI. A theme sets the style per widget type, so this covers all
  # buttons, tabs, sliders and the thermostat ring in one go. Non-clickable widgets never enter the
  # pressed state, so those stay untouched. The cards have a press of their own since firmware 0.2.95
  # (runtime_tiles::press_feedback): a darker shade of the card the moment the finger lands, fading
  # back over 200 ms when it lifts, LVGL's own style transition on the card alone.
  theme:
    obj:
      pressed:
        # bg_opa and not opa: opa would also fade the icon and text. Styles that
        # make LVGL draw into a buffer of its own (opa_layered, rotation/scale,
        # clip_corner, a slider fill rounded less than its track) cost KB's per
        # redraw that the CYD's heap can't spare; tests/test_layer_free.py.
        bg_opa: 45%
    slider:
      knob:
        pressed:
          bg_opa: 65%
    arc:
      knob:
        pressed:
          bg_opa: 65%

  # LVGL owns the rotation (display + touch) since ESPHome 2026.4.
  rotation: ${LVGL_ROTATION}

  style_definitions:
    # The page behind the tiles and the cards: one colour from the theme (theme.h PAGE), no wallpaper and no
    # gradient, so a redraw is a plain fill.
    - id: style_page
      bg_opa: COVER
      border_width: 0
      radius: 0

    - id: style_tile
      bg_opa: COVER
      radius: ${TILE_RADIUS}
      border_width: 1
      border_opa: COVER
      pad_left: ${TILE_PAD}
      pad_right: ${TILE_PAD}
      pad_top: ${TILE_PAD}
      pad_bottom: ${TILE_PAD}
      shadow_width: 0
      shadow_opa: 40%

    - id: style_icon_circle
      bg_opa: COVER
      radius: 999
      border_width: 0

    - id: style_room
      text_font: headline
      text_opa: 100%

    - id: style_time
      # The top bar's clock anchor is never shown (page_header.h draws the bar); it keeps the headline's letters.
      text_font: headline
      text_opa: 100%

    - id: style_title
      text_font: label
      text_opa: 100%

    - id: style_value
      text_font: sublabel
      text_opa: 100%

    - id: style_value_big
      text_font: sublabel_big
      text_opa: 80%

    # Paints: shared styles without a colour of their own. theme.h fills them (the list in on_boot, theme::paints)
    # and fills them again when Dark mode changes, so a widget names a paint where it used to write a colour.
    - id: paint_page_soft
    - id: paint_raised
    - id: paint_key
    - id: paint_key_pressed
    - id: paint_ink
    - id: paint_ink_soft
    - id: paint_scrim
    - id: paint_button_dark
    - id: paint_button_dark_pressed

  # ---------- ALERT OVERLAY (HA action show_alert) ----------
  # LVGL's top layer sits above every page, card and the dim overlay; the card
  # is filled by the alert_show script. Fixed positions, no layout engine.
  top_layer:
    widgets:
      - obj:
          id: alert_overlay
          x: 0
          y: 0
          # The glass it is on, whichever way that hangs (firmware 0.2.92+).
          width: 100%
          height: 100%
          hidden: true
          styles: paint_scrim
          bg_opa: 60%
          radius: 0
          border_width: 0
          pad_all: 0
          clickable: true
          scrollable: false
          scrollbar_mode: 'OFF'
          # Same look when pressed: a tap next to the card must not repaint the screen.
          pressed:
            bg_opa: 60%
          widgets:
            # Every size and place of the card and its parts is worked out on this screen's glass at boot
            # (screen_alert::layout, runtime_tiles::alert_place): none is written here.
            - obj:
                id: alert_card
                align: CENTER
                styles: paint_raised
                bg_opa: COVER
                radius: 18
                border_width: 1
                border_opa: COVER
                shadow_width: 0
                pad_all: 0
                clickable: false
                scrollable: false
                scrollbar_mode: 'OFF'
                widgets:
                  - label:
                      id: alert_icon
                      text: "\U000F002A"
                      text_font: materialdesign_icons
                      clickable: false
                  - label:
                      id: alert_title
                      long_mode: DOT
                      text: !lambda 'return std::string(screen_text::tr(screen_text::txt::alert_notification));'
                      text_font: headline
                      clickable: false
                  - label:
                      id: alert_subtitle
                      long_mode: DOT
                      text: ""
                      text_font: sublabel_big
                      styles: paint_ink_soft
                      clickable: false
                  - obj:
                      id: alert_ok
                      align: BOTTOM_RIGHT
                      radius: 999
                      styles: paint_button_dark
                      bg_opa: COVER
                      border_width: 0
                      shadow_width: 0
                      pad_all: 0
                      clickable: true
                      scrollable: false
                      pressed:
                        styles: paint_button_dark_pressed
                        bg_opa: COVER
                      on_click:
                        - if:
                            condition:
                              lambda: 'return screen_input::touch_guard.accept(millis(), 13);'
                            then:
                              - script.execute:
                                  id: alert_dismiss
                                  reason: "ok"
                      widgets:
                        - label:
                            id: alert_ok_label
                            align: CENTER
                            long_mode: DOT
                            text_align: CENTER
                            text: !lambda 'return std::string(screen_text::tr(screen_text::txt::alert_ok));'
                            text_font: headline
                            clickable: false
                  # The second button (show_alert_choice, firmware 0.3.3+): the left half of the row, the first the right,
                  # in a quieter key unless the automation names a colour. Hidden on an alert with one button.
                  - obj:
                      id: alert_button2
                      align: BOTTOM_RIGHT
                      hidden: true
                      radius: 999
                      styles: paint_key
                      bg_opa: COVER
                      border_width: 0
                      shadow_width: 0
                      pad_all: 0
                      clickable: true
                      scrollable: false
                      pressed:
                        styles: paint_key_pressed
                        bg_opa: COVER
                      on_click:
                        - if:
                            condition:
                              lambda: 'return screen_input::touch_guard.accept(millis(), 13);'
                            then:
                              - script.execute:
                                  id: alert_dismiss
                                  reason: "button2"
                      widgets:
                        - label:
                            id: alert_button2_label
                            align: CENTER
                            long_mode: DOT
                            text_align: CENTER
                            text: ""
                            text_font: headline
                            clickable: false

  pages:
    - id: home_page
      styles: style_page
      pad_all: 0
      scrollable: false
      scrollbar_mode: 'OFF'
      widgets:
        # Never shown: it only makes ESPHome compile LVGL's spinner, which the busy sheet on a tile draws.
        - spinner:
            id: busy_spinner_seed
            hidden: true
            width: 2
            height: 2
            spin_time: 1s
            arc_length: 60deg
        # Never shown either: it makes ESPHome compile LVGL's image widget, which the starting screen's Tessera mark is
        # drawn with on every board (firmware 0.3.8+).
        - image:
            id: brand_mark_seed
            hidden: true
            src: tessera_mark
        # Never shown either: it makes ESPHome compile LVGL's roller, the drum a light's effects page picks from
        # (firmware 0.2.70+).
        - roller:
            id: roller_seed
            hidden: true
            width: 2
            height: 2
            options: ["-"]
        - label:
            id: lbl_room
            x: ${HEADER_INSET}
            # page_header::Renderer moves it down until the top bar keeps HEADER_INSET from the top as well.
            y: 0
            text: "${ROOM_NAME}"
            styles: style_room

        # Enables LVGL's line widget for the runtime clock hands and sparklines.
        - line:
            id: runtime_line_enable
            hidden: true
            points:
              - 0, 0
              - 1, 1

        - label:
            id: lbl_time
            align: TOP_RIGHT
            x: -${HEADER_INSET}
            y: 0
            text: ""
            styles: style_time

        # The tile area: the cards of the page on the glass, in the cells of the grid. No dragging on resistive glass.
        - obj:
            id: tile_scroll
            x: 0
            y: ${SCROLL_Y}
            # Width and height come from the canvas at boot (runtime_tiles::grid_bind, firmware 0.2.92+): the
            # area runs the full width and stops where the page bar starts, whichever way the glass hangs.
            # These two are only the seed LVGL builds the object with.
            width: 1
            height: 1
            bg_opa: TRANSP
            # The cells of the grid the screen runs on (the board's GRID_COLS x GRID_ROWS, or the one ESP Screens gave
            # it, firmware 0.53.0+). The rows and columns are free units, so LVGL divides the area over them and keeps
            # the gaps; runtime_tiles::grid_cells sets the numbers at boot and on a new grid (a layout of one cell here
            # is enough for LVGL's grid to be built in) and place_page only says which cell a card takes. Every card
            # starts in the first cell, hence multiple_widgets_per_cell.
            layout:
              type: GRID
              grid_rows: 1
              grid_columns: 1
              multiple_widgets_per_cell: true
              grid_cell_x_align: STRETCH
              grid_cell_y_align: STRETCH
              # The gaps between the cards.
              pad_row: ${GRID_GAP_Y}
              pad_column: ${GRID_GAP_X}
            # A tap between two tiles presses this area: without its own pressed style the
            # theme's 45 % lights it up as a pale panel behind the tiles.
            pressed:
              bg_opa: TRANSP
            border_width: 0
            # The margin the cards keep from the sides of the glass.
            pad_left: ${GRID_MARGIN}
            pad_right: ${GRID_MARGIN}
            pad_top: 0
            pad_bottom: 0
            scrollable: false
            scrollbar_mode: 'OFF'
            # The cards themselves are made at boot, one per cell of the grid (runtime_tiles::make_cells); ESPHome
            # asks a grid for its widgets key all the same.
            widgets: []

        # ---------- VALUE SLIDER OVERLAY ----------
        # ---------- PAGE NAVIGATION: the band under the tiles ----------
        # Each half of the band is one key (firmware 0.2.69+): a chevron in its corner, lit up under a finger, and the
        # page dots between them. The band reaches from the tile area's end (SCROLL_Y + SCROLL_H) to the bottom edge.
        - obj:
            id: page_prev
            align: BOTTOM_LEFT
            x: 0
            y: 0
            width: 50%
            height: ${PAGE_BAR_H}
            pad_all: 0
            radius: 0
            bg_opa: TRANSP
            border_width: 0
            scrollable: false
            # Its press shows as a patch around the chevron or "Back" (runtime_tiles nav_key_event), not across
            # this half of the bar, which runs under the page dots; the half itself stays clear when pressed.
            pressed:
              bg_opa: TRANSP
            # on_click: LVGL sends no short click after a press of 400 ms, so a firm or slow press did nothing
            # (firmware 0.2.65+). The bar has no hold of its own; accept_repeat still drops bounce and a swipe.
            on_click:
              - if:
                  condition:
                    lambda: 'return screen_input::touch_guard.accept_repeat(millis(), 11);'
                  then:
                    - lambda: 'id(tile_page) = runtime_tiles::previous_button_page(id(tile_page));'
                    - script.execute: show_tile_page
            widgets:
              - label:
                  align: LEFT_MID
                  x: ${GRID_MARGIN}   # runtime_tiles::nav_align puts the ink on this line
                  text: "\U000F0141" # chevron-left
                  text_font: materialdesign_icons_mini
                  styles: paint_ink
                  clickable: false
        - obj:
            id: page_number
            align: BOTTOM_MID
            y: 0
            width: ${PAGE_NUMBER_W}
            height: ${PAGE_BAR_H}
            pad_all: 0
            bg_opa: TRANSP
            border_width: 0
            clickable: false
            scrollable: false
        - obj:
            id: page_next
            align: BOTTOM_RIGHT
            x: 0
            y: 0
            width: 50%
            height: ${PAGE_BAR_H}
            pad_all: 0
            radius: 0
            bg_opa: TRANSP
            border_width: 0
            scrollable: false
            pressed:
              bg_opa: TRANSP
            on_click:
              - if:
                  condition:
                    lambda: 'return screen_input::touch_guard.accept_repeat(millis(), 12);'
                  then:
                    - lambda: 'id(tile_page) = runtime_tiles::sequential_page(id(tile_page), 1);'
                    - script.execute: show_tile_page
            widgets:
              - label:
                  align: RIGHT_MID
                  x: -${GRID_MARGIN}
                  text: "\U000F0142" # chevron-right
                  text_font: materialdesign_icons_mini
                  styles: paint_ink
                  clickable: false

        # ---------- VACUUM CONTROL ----------
        # A vacuum is not a switch: start, pause, stop and return to
        # the dock are separate commands, and suction power is a separate axis.


        # ---------- DIM / WAKE OVERLAY ----------
        - obj:
            id: dim_wake_overlay
            x: 0
            y: 0
            # The glass it is on, whichever way that hangs (firmware 0.2.92+).
            width: 100%
            height: 100%
            hidden: true
            bg_opa: TRANSP
            # The tap that wakes a dimmed screen must not light up a pale sheet over it.
            pressed:
              bg_opa: TRANSP
            border_width: 0
            scrollable: false
            scrollbar_mode: 'OFF'
            clickable: true
            on_click:
              - script.execute: wake_display
              # A page that is one full tile switching something on or off switches with this push as well
              # (firmware 0.2.65+, runtime_tiles::wake_tap); on every other page the first touch only wakes.
              - lambda: 'runtime_tiles::wake_tap();'

    - id: touch_cal_page
      styles: ${TOUCH_TEST_PAGE_PAINT}
      bg_opa: COVER
      pad_all: 0
      border_width: 0
      scrollable: false
      widgets:
        - label:
            align: TOP_MID
            y: ${TOUCH_TEST_TITLE_Y}
            text: !lambda 'return std::string(screen_text::tr(screen_text::txt::${TOUCH_TEST_TITLE}));'
            text_font: ${TOUCH_TEST_TITLE_FONT}
        - obj:
            x: ${TOUCH_TEST_INSET}
