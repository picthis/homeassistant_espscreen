############################################################
# ESP Screens - the shared core: what every board's screen is made of.
#
# The LVGL tree the runtime fills (tiles, cards, overlays, the touch test page),
# the scripts, the API actions, the entities, the fonts and the globals. It carries
# no number that depends on the board: every size and font size is a ${NAME} from
# the board's look (packages/looks/), every board-only line of C++ a ${NAME} from a
# feature the board includes (packages/features/) or from the board file itself
# (packages/boards/), next to the board's hardware. An entry file includes this file
# and the board's: packages/<board>.yaml for a screen that builds over GitHub,
# <profile>.yaml in the repository root for a checkout. docs/PROFILES.md says how
# the files fit together and how a board is added.
#
# A screen gets its tiles from the ESP Screen Manager add-on while it runs, so no
# Home Assistant entity lives in here. The Material Design Icons font comes from
# fonts/materialdesignicons-webfont.ttf (Apache 2.0, github.com/Templarian/MaterialDesign-Webfont).
############################################################
substitutions:
  SCREEN_FIRMWARE_VERSION: "0.60.0"
  DASHBOARD_INBOX_INTERNAL: "false"
  CALIBRATION_ON_BOOT: "false"                     # a bench build: start on the touch test page
  ROOM_NAME: ""                                    # top left until ESP Screens sends the screen name
  # The language of every text on the screen (app 0.2.90): a file in screen_manager/translations, English for any
  # text it lacks. ESP Screens writes it into the screen's own YAML, from Home Assistant's language or its Settings.
  LANGUAGE: "en"
  # The letters a language written in another script needs beyond the Latin ones the text fonts always carry
  # (docs/TRANSLATING.md, "Letters"): only a screen built in such a language carries them, so no other screen spends
  # flash on them. One list per script with the letters its languages here write (Russian's now), the same letters as
  # header_bar.SCRIPT_GLYPHS in the add-on (a test keeps the two equal), and the languages that take it, those whose
  # translation file says `"script": "cyrillic"` (a test as well).
  SCRIPT_GLYPHS_CYRILLIC: "АБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯабвгдежзийклмнопрстуфхцчшщъыьэюяЁё№"
  SCRIPT_GLYPHS: '${ SCRIPT_GLYPHS_CYRILLIC if LANGUAGE.split("-")[0] in ["ru"] else "" }'
  # Swipe between pages on a screen that has stored no choice of its own: off, as every screen set up before had it, so
  # an update changes nothing there. New screen writes "1" into a new screen's own YAML, which then swipes and opens the
  # Dock out of the box. Once the screen stores a choice (any change of a setting), that choice wins. Keep "0" here.
  SWIPE_PAGES_DEFAULT: "0"

  ## DIM settings
  AUTO_DIM: "true"                                 # true = enable auto dimming
  AUTO_DIM_TIMEOUT: "600"                           # seconds after last touch
  MAX_BRIGHTNESS: "100"                            # backlight brightness in percent
  DIM_BRIGHTNESS: "20"                             # dimmed backlight brightness in percent
  NIGHT_MODE: "true"                               # true = use separate dim level at night
  NIGHT_START_HOUR: "22"                           # 0-23
  NIGHT_END_HOUR: "7"                              # 0-23
  NIGHT_DIM_BRIGHTNESS: "10"                       # backlight brightness in percent at night

  # What a board file, a feature or a screen's own YAML may state instead: the value here holds when none of them
  # does. A board states its hardware and what differs (docs/PROFILES.md, "Defaults").
  ROTATION_LANDSCAPE: "0"                          # the LVGL angle that lays the panel out lying down
  LVGL_ROTATION: "${ROTATION_LANDSCAPE}"           # which way it is built to hang (New screen writes it for one standing
                                                   # up); the editor turns it later without a build (runtime_tiles::hang)
  # How the camera's sensor sits against the glass: 0 as the glass, 180 upside down (the Tab5). Only those two; the
  # camera turns its picture upright from this and the screen's rotation (camera_turn.h, plugin API 0.19).
  CAMERA_ORIENTATION: "0"
  TOUCH_SWAP_XY: "false"                           # the touch panel's axes against the display's own pixels
  TOUCH_MIRROR_X: "false"
  TOUCH_MIRROR_Y: "false"
  # The most tiles and pages one screen holds (firmware 0.34.0+), over all its pages whatever its grid. A board with
  # PSRAM states more; the memory the tiles need decides how many of them a layout really takes (tile_memory.h).
  SCREEN_MAX_TILES: "64"
  SCREEN_MAX_PAGES: "8"
  # The most items one page's top bar holds (firmware 0.34.0+); the glass's width decides how many of them show.
  SCREEN_MAX_BAR_ITEMS: "6"
  BACKLIGHT_DIMMABLE: "true"                       # false: the backlight is lit or dark, a switch instead of a percentage
  CAN_STANDBY: "true"                              # false: the screen never goes dark (features/backlight-always-on.yaml)
  # 0: the bedside clock takes the display step, never digits of its own (hardware/flash-4mb.yaml, looks/shared/digits.yaml).
  BEDSIDE_OWN_DIGITS: "1"
  # The touch test page (CALIBRATION_ON_BOOT); its sizes are the look's.
  TOUCH_TEST_PAGE_PAINT: "paint_page_soft"         # the page
  TOUCH_TEST_TITLE: "calibration_touch_check"      # the words at the top
  TOUCH_TEST_PAINT: "paint_ink"                    # the crosses
  # Code the shared lambdas below take from a feature or a board, at the place named ${...}; empty when nothing
  # adds anything there. BOOT_TOUCH, BOOT_PAGE_GESTURE, APPLY_BACKLIGHT and OTA_BACKLIGHT have no default: every screen
  # reads a touch panel and lights a backlight, so the board says how (features/capacitive-touch.yaml, features/backlight.yaml).
  CAMERA_PAINT_FILL: ""                            # the paint styles a feature brings (theme::paints)
  CALIBRATION_PAINT_FILL: ""
  BOOT_CAMERA_HOOKS: ""                            # after the gesture: the camera images (features/camera.yaml)
  BOOT_CARDS_TAIL: ""                              # after the cards' hooks, before the settings page's
  # A board's extras on the settings page (docs/SETTINGS.md, "A board's own settings"): rows a feature or the board file
  # puts in settings_screen::board_rows. A screen without any has no Extras page.
  BOOT_AUDIO: ""                                   # features/audio.yaml: the speaker's bus, the microphone
  BOOT_SPEAKER_PART: ""                            # the speaker's codec (packages/hardware/parts/)
  BOOT_MIC_CONTROLS: ""                            # the microphones' gain and ALC (parts/es7210-controls.yaml)
  BOOT_MICROPHONE_PART: ""                         # the microphones' codec and its transport (parts/es7210.yaml)
  BOOT_BOARD_SETTINGS: ""                          # the board file's own
  # The screen's moments (every 250 ms, the cards closing, the settings page opening, away from page 1, an alert) are
  # lists, not substitutions (screen_hooks.h): a feature adds to them at boot, a plugin through the plugin API.
  # one more line of the ui_state diagnostics
  UI_STATE_HOOK: "ESP_LOGI(\"ui_diag\", \"rotation=%u actual=%u\", (unsigned)runtime_tiles::rotation, (unsigned)id(screen_lvgl).get_rotation());"

# ============================================================
# No need to edit below this line for a screen of your own: the sizes are the
# board file's, the credentials the entry file's (secrets.yaml, see secrets.yaml.example).
# ============================================================
esphome:
  # The oldest ESPHome these packages build with, not the one the add-on ships (2026.9.0, screen_manager/Dockerfile): an
  # add-on or ESPHome Device Builder that isn't updated yet keeps building every screen (firmware 0.2.75+). Raise it in a
  # release of its own, with the camera images' `image:` form (before ESPHome 2027.1) and OTA with the api key for new
  # screens; docs/RELEASING.md, "ESPHome versions".
  min_version: 2026.6.2
  project:
    name: maxgramser.esp_screen
    version: "${SCREEN_FIRMWARE_VERSION}"
  # Still under platformio_options, although ESPHome 2026.9 calls that deprecated and offers `esphome: build_flags`:
  # its LVGL only reads these flags when it writes lv_conf.h, and writes `LV_USE_SWITCH 0` over the other form.
  platformio_options:
    build_flags:
      - -DLV_USE_SWITCH=1
      # The sliders are all made in C++ now (a tile's strip, the blind's, the light and fan card's): ESPHome
      # writes lv_conf.h from the widgets the YAML names, and since the brightness overlay left it there is no
      # `slider:` left to name one (firmware 0.2.80).
      - -DLV_USE_BAR=1
      - -DLV_USE_SLIDER=1
      # The band of a heat/cool range in the thermostat card (firmware 0.25.0) is LVGL's scale; the YAML names none.
      - -DLV_USE_SCALE=1
      - -DGRID_COLS=${GRID_COLS}
      - -DGRID_ROWS=${GRID_ROWS}
      # The cells of a page when this screen stands up (firmware 0.2.92+). A board states both grids and the
      # screen picks one at boot from its canvas, so one firmware serves a board either way round.
      - -DGRID_COLS_PORTRAIT=${GRID_COLS_PORTRAIT}
      - -DGRID_ROWS_PORTRAIT=${GRID_ROWS_PORTRAIT}
      # The grids ESP Screens may give the screen (firmware 0.53.0+, looks/shared/grid.yaml): the tables are sized for the most.
      - -DGRID_MIN_COLUMNS=${GRID_MIN_COLUMNS}
      - -DGRID_MIN_ROWS=${GRID_MIN_ROWS}
      - -DGRID_MAX_COLUMNS=${GRID_MAX_COLUMNS}
      - -DGRID_MAX_ROWS=${GRID_MAX_ROWS}
      - -DGRID_MAX_COLUMNS_PORTRAIT=${GRID_MAX_COLUMNS_PORTRAIT}
      - -DGRID_MAX_ROWS_PORTRAIT=${GRID_MAX_ROWS_PORTRAIT}
      # The ceilings of one screen (firmware 0.34.0+): page_protocol.h sizes every per-tile and per-page table from them.
      - -DSCREEN_MAX_TILES=${SCREEN_MAX_TILES}
      - -DSCREEN_MAX_PAGES=${SCREEN_MAX_PAGES}
      - -DSCREEN_MAX_BAR_ITEMS=${SCREEN_MAX_BAR_ITEMS}
  includes:
    - <esphome/components/smart_display/screen_input.h>
    - <esphome/components/smart_display/light_controls.h>
    - <esphome/components/smart_display/alert_overlay.h>
    - <esphome/components/smart_display/settings_screen.h>
    - <esphome/components/smart_display/screen_power.h>
  name: ${DEVICE_NAME}
  friendly_name: ${DEVICE_FRIENDLY_NAME}
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // Which way the glass hangs (firmware 0.53.0+): as it was built, or as ESP Screens stood it up or laid it down
          // since. Before anything else measures the canvas: the touch filter, the grid, the top bar, the alert card.
          runtime_tiles::hang_at_boot(${ROTATION_LANDSCAPE}, ${LVGL_ROTATION}, ${PANEL_W} == ${PANEL_H});
          const auto hung = static_cast<esphome::display::DisplayRotation>(runtime_tiles::base_turn);
          if (id(screen_lvgl).get_rotation() != hung) id(screen_lvgl).set_rotation(hung);
      - lambda: |-
          ${BOOT_TOUCH}
      - lambda: |-
          auto &settings = screen_settings::current;
          settings.standby_enabled = std::string("${AUTO_DIM}") == "true";
          settings.standby_seconds = atoi("${AUTO_DIM_TIMEOUT}");
          settings.brightness = atoi("${MAX_BRIGHTNESS}");
          settings.standby_brightness = atoi("${DIM_BRIGHTNESS}");
          settings.night_enabled = std::string("${NIGHT_MODE}") == "true";
          settings.night_start = atoi("${NIGHT_START_HOUR}") * 60;
          settings.night_end = atoi("${NIGHT_END_HOUR}") * 60;
          settings.night_brightness = atoi("${NIGHT_DIM_BRIGHTNESS}");
          runtime_tiles::watch_font = id(headline)->get_lv_font();
          runtime_tiles::watch_value_font = id(watch_value)->get_lv_font();
          runtime_tiles::watch_icon_font = id(watch_icon)->get_lv_font();
          runtime_tiles::clock_font = id(clock_digits)->get_lv_font();
          runtime_tiles::bedside_font = id(bedside_digits)->get_lv_font();
          runtime_tiles::display_font = id(display_digits)->get_lv_font();
          runtime_tiles::brand_font = id(brand_wordmark)->get_lv_font();
          runtime_tiles::brand_mark = id(tessera_mark)->get_lv_image_dsc();
          runtime_tiles::firmware_version = "${SCREEN_FIRMWARE_VERSION}";
          runtime_tiles::now_time = []() { return id(homeassistant_time).now(); };
          runtime_tiles::screen_awake = []() { return !id(display_dimmed); };
          // The screensaver (firmware 0.29.0+): a new word from ESP Screens in standby sets the level and the glass again.
          runtime_tiles::saver_changed = []() { id(apply_screen_settings).execute(false); };
          runtime_tiles::mini_icon_font = id(materialdesign_icons_mini)->get_lv_font();
          // The top bar of every page a tap opens (detail_bar.h): its keys' glyphs and the page's name.
          detail_bar::icon_font = id(materialdesign_icons_mini)->get_lv_font();
          detail_bar::title_font = id(headline)->get_lv_font();
          // The pager every page shares (page_bar.h): the tile pages' chevrons, and the row font for "3 / 12".
          page_bar::icon_font = id(materialdesign_icons_mini)->get_lv_font();
          page_bar::words_font = id(sublabel_big)->get_lv_font();
          runtime_tiles::big_icon_font = id(materialdesign_icons_big)->get_lv_font();
          runtime_tiles::control_font = id(sublabel_big)->get_lv_font();
          runtime_tiles::small_font = id(sublabel)->get_lv_font();
          runtime_tiles::label_font = id(label)->get_lv_font();
          // A plain card's name where it has room, in the compact look (runtime_tiles::name_font, firmware 0.6.0+).
          runtime_tiles::wide_name_font = id(${WIDE_NAME_FONT})->get_lv_font();
          // Top bar (0.2.32+): values in the text font, icons in the small icon font; the clock
          // label lends its margin and drawing order and stays hidden in runtime mode.
          runtime_tiles::header_text_font = id(sublabel_big)->get_lv_font();
          runtime_tiles::header_icon_font = id(materialdesign_icons_mini)->get_lv_font();
          runtime_tiles::header_home_mark = id(tessera_mark_bar)->get_lv_image_dsc();
          runtime_tiles::header_back_font = id(materialdesign_icons_back)->get_lv_font();
          runtime_tiles::header_status_font = id(materialdesign_icons_status)->get_lv_font();
          // The battery the top bar can show (firmware 0.41.0, docs/BATTERY.md): the screen's own sensor of Home
          // Assistant's battery class, and its battery_charging binary sensor, whatever the board measures them with.
          runtime_tiles::find_battery();
          runtime_tiles::time_label = id(lbl_time);
          runtime_tiles::enabled = true;
          // Turning (firmware 0.2.80 on every board): a half turn keeps the canvas and the grid, so every screen
          // offers it; a quarter turn only a square one, whose canvas is the same either way. On other glass a quarter
          // turn is another canvas and another grid, which the layout must be laid out on again: ESP Screens gives it
          // with the layout (begin's "upright", runtime_tiles::hang, firmware 0.53.0+), never this page.
          settings_screen::quarter_turns = ${PANEL_W} == ${PANEL_H};
          // Whether this board's backlight takes levels (firmware 0.2.90+): a board whose backlight is one line
          // shows a switch where the others show a percentage. ESP Screens reads the same fact from boards.json.
          settings_screen::dimmable = ${BACKLIGHT_DIMMABLE};
          // Whether this board's screen can go dark at all (firmware 0.2.91+): the Waveshare's backlight boost pulls
          // the 3.3 V rail under the brownout level when it switches on from a dark screen, so that board has no
          // standby and no night. The rows, the entities and the add-on's Settings follow the same fact.
          settings_screen::can_standby = ${CAN_STANDBY};
          // Swipe between pages before the screen's own choice is read: the start value of a screen that stored none.
          settings_screen::swipe_pages = ${SWIPE_PAGES_DEFAULT};
          runtime_tiles::load_settings();
          // Colours (firmware 0.2.54+): the styles of this profile take their colours from theme.h. The list runs now,
          // in the look the screen saved, before anything is drawn, and again after every change of look.
          theme::paints = []() {
            using theme::Paint;
            for (auto *style : {id(style_room), id(style_time), id(style_title), id(style_value_big), id(paint_ink)}) theme::fill(style, Paint::ink);
            theme::fill(id(style_page), Paint::page);
            theme::fill(id(style_tile), Paint::card);
            theme::fill(id(style_icon_circle), Paint::accent_tint);
            theme::fill(id(style_value), Paint::muted);
            theme::fill(id(paint_page_soft), Paint::page_soft);
            theme::fill(id(paint_raised), Paint::raised);
            theme::fill(id(paint_key), Paint::key);
            theme::fill(id(paint_key_pressed), Paint::key_pressed);
            theme::fill(id(paint_ink_soft), Paint::ink_soft);
            theme::fill(id(paint_scrim), Paint::scrim);
            theme::fill(id(paint_button_dark), Paint::button_dark);
            theme::fill(id(paint_button_dark_pressed), Paint::button_dark_pressed);
            ${CAMERA_PAINT_FILL}
            ${CALIBRATION_PAINT_FILL}
          };
          theme::paints();
          theme::set_dark(settings_screen::dark_mode != 0);
          runtime_tiles::settings_changed = []() { id(apply_screen_settings).execute(false); };
          runtime_tiles::dismiss = []() {
            effects_page::close();
            group_page::close();
            runtime_tiles::hide_detail();
            screen_hooks::run_cards_closed();
          };
          runtime_tiles::layout_changed = []() { id(show_tile_page).execute(); };
          ${BOOT_PAGE_GESTURE}
          ${BOOT_CAMERA_HOOKS}
          runtime_tiles::refresh = []() { if (!id(ui_refresh).is_running()) id(ui_refresh).execute(); };
          // What a finger on the glass does lives in the shared tree (runtime_tiles::touch_input); a board's
          // three touchscreen triggers are one line each. These four are what only the YAML can answer.
          runtime_tiles::touch_input::contact = [](bool down) {
            id(last_touch_ms) = millis();
            id(last_use_ms) = millis();
            id(touch_down) = down;
          };
          runtime_tiles::touch_input::to_screen = [](int &x, int &y) {
            int32_t px = x, py = y;
            id(screen_lvgl).rotate_coordinates(px, py);
            x = px; y = py;
          };
          // A dimmed screen only wakes, a calibration and an alert own the glass: no edge swipe does anything then.
          runtime_tiles::touch_input::swipe_blocked = []() -> const char * {
            if (id(display_dimmed)) return "screen dimmed";
            if (id(calibration_active)) return "calibration";
            if (id(alert_active)) return "alert showing";
            return nullptr;
          };
          runtime_tiles::touch_input::card_open = runtime_tiles::colour_shown;
          // The way home for the house in the top bar and for a swipe up from the bottom edge (firmware 0.2.100+, from
          // over any card or the settings page 0.28.0+): the same script the Back to page 1 timeout and Home Assistant
          // use, so there is one way home, and it closes everything on the way.
          runtime_tiles::back_home = []() { id(go_home).execute(); };
          // An alarm panel that someone comes in on, or that goes off, wakes the screen as a touch does and opens its
          // card (firmware 0.3.3+): Back to page 1 counts from now.
          runtime_tiles::alarm_wake = []() { id(last_use_ms) = millis(); id(wake_display).execute(); };
          // A plugin wakes the screen as Home Assistant's Wake button does (tessera::wake, plugin API 0.16): the one way
          // in for every wake that is not a finger, the script wake_from, with the plugin's name for the log.
          plugin_host::wake = [](const std::string &source) { id(wake_from).execute(source); };
          // How a doorbell's ring ended on this screen goes to ESP Screens (module doorbell, esphome.screen_doorbell).
          runtime_tiles::doorbell_reports([](const std::string &action, const std::string &key) { id(doorbell_report).execute(action, key); });
          // Saving power while the glass is dark (screen_power.h): LVGL pauses, and Wi-Fi dozes.
          screen_power::freeze = [](bool on) { id(screen_lvgl).set_paused(on, false); ESP_LOGI("power", on ? "dark: saving" : "awake"); };
          screen_power::later = [](uint32_t ms) { id(screen_power_wait).execute(ms); };
          screen_power::dark = []() { return id(display_dimmed) && runtime_tiles::standby_level() == 0; };
          screen_power::wake = []() { id(wake_display).execute(); };
          // Feedback a finger hears or feels (touch_feedback.h): none for the push that wakes a dimmed screen, nor in a calibration.
          touch_feedback::quiet = []() { return id(display_dimmed) || id(calibration_active); };
          {
            // A touch on the dark glass resumes drawing before LVGL reads it, so the wake overlay gets the tap.
            struct WakeListener : public esphome::touchscreen::TouchListener {
              void update(const esphome::touchscreen::TouchPoints_t &points) override { if (!points.empty()) screen_power::touched(esphome::millis()); }
              void release() override { screen_power::released(esphome::millis()); }
            };
            id(ts_touch).register_listener(new WakeListener());
          }
          runtime_tiles::touch_input::turn_page = [](int target) {
            id(tile_page) = target;
            id(show_tile_page).execute();
          };
          // The board states its density with the decimals it has (DISPLAY_DPI); the firmware scales by the nearest
          // whole number, the look took the exact one for its sizes.
          ui::configure(atoi("${ (DISPLAY_DPI | float) | round | int }"), "${LOOK}");
          runtime_tiles::grid_bind(id(tile_scroll), atoi("${GRID_MARGIN}"), atoi("${PAGE_BAR_H}"));
          // Full: a tap on the page dots opens the Dock, the chevrons keep the bar's outer parts (the dock module).
          runtime_tiles::page_dots_open(id(page_number));
          // The alert card, laid out on the glass it landed on (firmware 0.2.103+): screen_alert::layout works every
          // size out from the canvas, the look and the fonts, lying down or standing up, and runtime_tiles::alert_place
          // puts the parts; an alert with a camera image lays it out again with room for the picture.
          runtime_tiles::alert_parts = {id(alert_card), id(alert_icon), id(alert_title), id(alert_subtitle), id(alert_ok),
                                        id(alert_ok_label), id(alert_button2), id(alert_button2_label)};
          runtime_tiles::alert_place(false);
          runtime_tiles::setpoint_font = id(setpoint_digits)->get_lv_font();
          // The cards of the grid, one per cell, in the styles below (firmware 0.53.0+: made in C++, so the grid is
          // no longer fixed by a file of cards per board); runtime_tiles::make_card builds more of them for the kept
          // pages of a board with PSRAM (firmware 0.3.2+).
          runtime_tiles::card_look = {id(style_tile), id(style_icon_circle), id(style_title), id(style_value)};
          runtime_tiles::make_cells(id(materialdesign_icons)->get_lv_font(), ${TILE_ICON_SIZE});
          // Another grid from ESP Screens (firmware 0.53.0+) shows in the Screen layout sensor at once, not a minute later.
          runtime_tiles::grid_changed = []() { id(screen_layout).update(); };
      - lambda: |-
          // The colour card (runtime_tiles::colour_open) and the pages behind its keys, a light's effects (firmware
          // 0.2.70+) and a group's lamps (0.3.9+): their fonts and the board's touch limit here, the rest in C++
          // (runtime_tiles::bind_pages), which the browser preview runs too.
          effects_page::title_font = id(headline)->get_lv_font();
          effects_page::row_font = id(${EFFECTS_ROW_FONT})->get_lv_font();
          effects_page::roller_font = id(sublabel_big)->get_lv_font();
          effects_page::icon_font = id(materialdesign_icons_mini)->get_lv_font();
          effects_page::tap_limit = ${TOUCH_MOVE_LIMIT_PX};
          runtime_tiles::bind_pages();
          ${BOOT_CARDS_TAIL}
          ${BOOT_AUDIO}
          ${BOOT_SPEAKER_PART}
          ${BOOT_MIC_CONTROLS}
          ${BOOT_MICROPHONE_PART}
          ${BOOT_BOARD_SETTINGS}
          plugin_host::ready();
      # The settings page the screen opens on its own (0.2.44+): the same values ESP Screen Manager
      # writes, reachable by holding the top bar. Fonts and hooks only; the page itself is built
      # when it opens and thrown away when it closes, so it costs nothing while it is closed.
      - lambda: |-
          if (!runtime_tiles::enabled) return;
          settings_screen::title_font = id(headline)->get_lv_font();
          settings_screen::row_font = id(sublabel_big)->get_lv_font();
          settings_screen::icon_font = id(materialdesign_icons_mini)->get_lv_font();
          settings_screen::store = []() { runtime_tiles::persist_settings(); };
          settings_screen::apply = []() {
            runtime_tiles::apply_debug_mode();
            id(apply_screen_settings).execute(false);
          };
          settings_screen::report = [](const char *key, int32_t value) { runtime_tiles::setting_event(key, value); };
          settings_screen::name_text = []() { return std::string("${DEVICE_FRIENDLY_NAME}"); };
          settings_screen::address_text = []() { return id(wifi_ip).state.empty() ? std::string(screen_text::tr(screen_text::txt::status_no_network)) : id(wifi_ip).state; };
          settings_screen::firmware_text = []() { return std::string("${SCREEN_FIRMWARE_VERSION}"); };
          settings_screen::link_text = []() {
            return std::string(screen_text::tr(esphome::api_is_connected() ? screen_text::txt::settings_connected : screen_text::txt::settings_not_connected));
          };
          settings_screen::wifi_text = []() {
            const auto link = wifi_status::link();
            if (!link.connected) return std::string(screen_text::tr(screen_text::txt::status_no_network));
            return link.ssid + " \u00B7 " + std::to_string(link.rssi) + " dBm";
          };
          // The screen's own explanation on the alert card (runtime_tiles::hint_alert): no icon colour, no blinks, until OK.
          runtime_tiles::hint_alert = [](const std::string &title, const std::string &text) {
            runtime_tiles::own_alert_next = true;
            id(alert_show).execute(title, text, std::string("alert-circle-outline"), std::string(), std::string(), std::string(),
                                   std::string(), std::string(), 0, false);
          };
          // An update wakes the screen before it says how far it is (ota_status.h): lit, out of standby, no screensaver.
          ota_status::wake = []() {
            id(screen_power_wait).stop();
            screen_power::leave();
            // Sleep stays asked for: the screen restarts after the update, and a failed one dims again on its own time.
            id(display_dimmed) = false;
            id(last_touch_ms) = millis();
            plugin_host::before_update();
            runtime_tiles::saver_wake();
            lv_obj_add_flag(id(dim_wake_overlay), LV_OBJ_FLAG_HIDDEN);
            ${OTA_BACKLIGHT}
          };
          runtime_tiles::open_this_screen = []() {
            if (!settings_screen::may_open || !settings_screen::may_open()) return;
            id(last_use_ms) = millis();
            settings_screen::open(4);
          };
          settings_screen::tessera_text = []() {
            return std::string(screen_text::tr(runtime_tiles::feed_alive() ? screen_text::txt::settings_connected : screen_text::txt::settings_not_connected));
          };
          settings_screen::restart_device = []() { ESP_LOGI("settings", "restart from the screen"); App.safe_reboot(); };
          // A dimmed screen, a calibration or an alert owns the glass; the page waits.
          settings_screen::may_open = []() {
            return runtime_tiles::enabled && !id(display_dimmed) && !id(calibration_active) && !id(alert_active) && !screen_hooks::settings_kept_closed();
          };
          settings_screen::drift = []() { return screen_input::touch_guard.distance(); };
          settings_screen::before_open = []() { id(close_cards).execute(); };
          settings_screen::hold_limit = ${SETTINGS_HOLD_DRIFT_PX};
          settings_screen::tap_limit = ${TOUCH_MOVE_LIMIT_PX};
          // What a change of look draws again, now that everything is bound: the tiles, the top bar and an open card,
          // the colour card, the settings page and an alert.
          theme::redraw = []() {
            runtime_tiles::restyle();
            runtime_tiles::colour_restyle();
            effects_page::restyle();
            group_page::restyle();
            settings_screen::restyle();
            if (id(alert_active)) lv_obj_set_style_bg_color(id(alert_card), lv_color_hex(theme::surface(id(alert_card_color))), LV_PART_MAIN);
          };
          // Under the cards: the colour card is the first of them on the page, so the back button and
          // the action at the top right of a card keep their taps.
          settings_screen::attach_hold(id(home_page)->obj, ${SETTINGS_HOLD_X}, 0,
            overlay_card::screen_width() - ${SETTINGS_HOLD_X} * 2, ${SCROLL_Y});
      - light.turn_on:
          id: back_light
          brightness: !lambda "return screen_settings::current.brightness / 100.0f;"
      - script.execute: show_tile_page
      - lambda: 'if (!id(ui_refresh).is_running()) id(ui_refresh).execute();'
      - if:
          condition:
            lambda: 'return std::string("${CALIBRATION_ON_BOOT}") == "true";'
          then:
            - lambda: 'id(calibration_active) = true;'
            - lvgl.page.show: touch_cal_page
            - lambda: |-
                lv_obj_invalidate(id(touch_cal_page)->obj);
                lv_refr_now(nullptr);
                ESP_LOGI("ui_diag", "${TOUCH_TEST_READY_LOG}");


logger:
  # INFO (firmware 0.2.75+): the lines below INFO, ESPHome's configuration dump and its per-state debug lines, are left
  # out of the firmware, 9 KB on the CYD. For a diagnosis, give one screen `logger: level: DEBUG` in its Override YAML.
  level: INFO
  logs:
    # ESP-IDF's own lines (a driver's error, the JPEG decoder refusing a picture) reach ESPHome's log at INFO whatever
    # their own level, under this tag: kept at INFO so they come with Debug mode off too (settings_screen.h), where the
    # rest of the log is warnings and errors. ESP-IDF itself writes its errors alone on these screens.
    esp-idf: INFO
    sensor: WARN
    text_sensor: WARN
    xpt2046: WARN
    homeassistant.sensor: WARN
    homeassistant.text_sensor: WARN

# A lit screen's Wi-Fi never dozes (firmware 0.2.74+). With ESPHome's default for the ESP32,
# `light`, every message from Home Assistant waits at the router for the next beacon: 76-117 ms on the bench screens
# against about 20 ms, and an image download held a loop up to 0.1 s now and then (measured with firmware 0.2.73). The
# network and its password stay in the screen's own YAML, and a `power_save_mode` there wins over this one. A dark
# screen lets the radio doze and gives it back its own mode when it wakes (screen_power.h).
wifi:
  power_save_mode: none


# Credentials are loaded from secrets.yaml — copy secrets.yaml.example to secrets.yaml and fill in your values.
api:
  # Who connects (firmware 0.38.0): a client that left before it named itself had a key that is not this screen's, and
  # the starting screen says so (runtime_tiles::client_left); one that gets in clears that.
  on_client_connected:
    - lambda: 'runtime_tiles::client_came();'
  on_client_disconnected:
    - lambda: 'runtime_tiles::client_left(client_info, client_address);'
  actions:
    - action: touch_diagnostics
      then:
        - lambda: 'id(calibration_active) = true;'
        - script.execute: wake_display
        - lvgl.page.show: touch_cal_page
        - lambda: |-
            lv_obj_invalidate(id(touch_cal_page)->obj);
            lv_refr_now(nullptr);
            ESP_LOGI("ui_diag", "calibration page active=%d", lv_screen_active() == id(touch_cal_page)->obj);
    - action: end_touch_diagnostics
      then:
        - lambda: 'id(calibration_active) = false;'
        - lvgl.page.show: home_page
    - action: ui_state
      then:
        - lambda: |-
            const auto &cfg = screen_settings::current;
            // The settings are int32_t, and on this toolchain int32_t is `long int`, not `int`: %d then warns on
            // every one of them (eleven warnings a build, which is how a real one goes unnoticed). Both are 32 bits
            // on an ESP32, so the numbers were right; the cast says so to the compiler as well.
            ESP_LOGI("ui_diag", "settings standby=%d timeout=%d brightness=%d dim=%d night=%d start=%d end=%d night_dim=%d clock=%d clock24=%d home=%d idle_ms=%u use_idle_ms=%u dimmed=%d",
              (int) cfg.standby_enabled, (int) cfg.standby_seconds, (int) cfg.brightness, (int) cfg.standby_brightness,
              (int) cfg.night_enabled, (int) cfg.night_start, (int) cfg.night_end, (int) cfg.night_brightness,
              (int) cfg.show_clock, (int) cfg.clock_24h, (int) cfg.home_on_standby,
              (unsigned)(millis() - id(last_touch_ms)), (unsigned)(millis() - id(last_use_ms)), id(display_dimmed));
            ESP_LOGI("ui_diag", "navigation page=%d runtime_detail=%d", id(tile_page),
              runtime_tiles::detail_root && !lv_obj_has_flag(runtime_tiles::detail_root, LV_OBJ_FLAG_HIDDEN));
            ${UI_STATE_HOOK}
            lv_area_t nav, grid;
            lv_obj_update_layout(id(home_page)->obj);
            lv_obj_get_coords(id(page_next), &nav);
            lv_obj_get_coords(id(tile_scroll), &grid);
            ESP_LOGI("ui_diag", "home=%d calibration=%d grid=%d,%d,%d,%d next=%d,%d,%d,%d",
                lv_screen_active() == id(home_page)->obj, lv_screen_active() == id(touch_cal_page)->obj,
                (int) grid.x1, (int) grid.y1, (int) grid.x2, (int) grid.y2,
                (int) nav.x1, (int) nav.y1, (int) nav.x2, (int) nav.y2);
    - action: preview_runtime_card
      variables:
        index: int
      then:
        - lambda: |-
            if (index < 0) { runtime_tiles::hide_detail(); if (runtime_tiles::dismiss) runtime_tiles::dismiss(); return; }
            // Whatever a hold on the tile itself opens (runtime_tiles::hold_card): the runtime card for almost everything,
            // the colour card for a light with a colour.
            if (index >= 0) runtime_tiles::hold_card(index);
    # The settings page from Home Assistant: `page` 0 is its menu, 1-4 open a group straight away
    # (Brightness, Night, Screen, This screen) and a negative page closes it and goes back to page 1.
    # Handy for support ("look at Screen -> Rotation") and for the render tests.
    - action: open_settings
      variables:
        page: int
      then:
        - lambda: |-
            if (page < 0) { id(go_home).execute(); return; }
            // Opened for someone to look at: Back to page 1 counts from now, as after a touch.
            id(last_use_ms) = millis();
            id(wake_display).execute();
            settings_screen::open((uint8_t) page);
            ESP_LOGI("settings", "page %d open from Home Assistant", (int) page);

    # Home Assistant automations: esphome.<device>_show_page puts a page of tiles on the screen (README,
    # "Open a page from an automation"), the way a Go to page tile does: a player that starts an album can
    # bring up the page with its full-page player. The screen wakes, a card or the settings page closes,
    # and Back to page 1 counts from now, as after a touch. `page` is the number the editor shows, 1 up;
    # a number past the last page opens the last page. An alert that is showing stays in front of it.
    # The screen wakes first: a layout that came while it stood dark is prepared only once it is lit, and before it is
    # ready the page waits (runtime_tiles::wanted_page) and opens then, from the 1 s interval below.
    - action: show_page
      variables:
        page: int
      then:
        - lambda: |-
            id(last_use_ms) = millis();
            id(wake_display).execute();
            if (!runtime_tiles::navigation_ready()) {
              runtime_tiles::wanted_page = std::max(1, (int) page);
              ESP_LOGI("navigation", "show page %d waits until the pages are ready", runtime_tiles::wanted_page);
              return;
            }
            runtime_tiles::wanted_page = 0;
            id(open_page).execute(page);

    # Diagnostics: the busy sheet of a tile, without touching the glass or Home Assistant.
    - action: preview_busy
      variables:
        index: int
      then:
        - lambda: |-
            if (runtime_tiles::enabled && index >= 0 && index < (int)runtime_tiles::model.count) {
              runtime_tiles::model.tiles[index].begin(millis());
              if (runtime_tiles::refresh) runtime_tiles::refresh();
            }
    - action: light_controls_preview
      then:
        - script.execute: light_controls_preview
    - action: ui_self_test
      then:
        - script.execute: ui_self_test
    # Home Assistant automations: esphome.<device>_show_alert puts a card over the whole
    # screen (README, "Alert from an automation"); dismiss_alert removes it again.
    - action: show_alert
      variables:
        title: string
        subtitle: string
        icon: string
        color: string
        button_text: string
        timeout: int
        flash: bool
      then:
        - script.execute:
            id: alert_show
            title: !lambda 'return title;'
            subtitle: !lambda 'return subtitle;'
            icon: !lambda 'return icon;'
            color: !lambda 'return color;'
            button_text: !lambda 'return button_text;'
            button_color: ""
            button2_text: ""
            button2_color: ""
            timeout: !lambda 'return timeout;'
            flash: !lambda 'return flash;'
    # The same card with a second button on the left of the first (firmware 0.3.3+), for a choice such as Decline and
    # Accept, and a colour of its own for either button (red, green, blue, ...: the names of `color`). Its own action, as
    # Home Assistant makes every field of an action required: show_alert keeps its seven, so no automation that calls it
    # breaks. The second button ends the alert as esphome.screen_alert with action button2.
    - action: show_alert_choice
      variables:
        title: string
        subtitle: string
        icon: string
        color: string
        button_text: string
        button_color: string
        button2_text: string
        button2_color: string
        timeout: int
        flash: bool
      then:
        - script.execute:
            id: alert_show
            title: !lambda 'return title;'
            subtitle: !lambda 'return subtitle;'
            icon: !lambda 'return icon;'
            color: !lambda 'return color;'
            button_text: !lambda 'return button_text;'
            button_color: !lambda 'return button_color;'
            button2_text: !lambda 'return button2_text;'
            button2_color: !lambda 'return button2_color;'
            timeout: !lambda 'return timeout;'
            flash: !lambda 'return flash;'
    - action: dismiss_alert
      then:
        - script.execute:
            id: alert_dismiss
            reason: "remote"
    # ESP Screen Manager 0.2.39+ hands a whole tile message over in one call instead of
    # base64 chunks in the text inbox; the inbox keeps showing the result.
    # Firmware 0.2.49+ also answers a caller that asks for it (app 0.2.57+ does for its pings): the same
    # status as the inbox, plus the revision of the layout on the screen. A call without a call id
    # (older apps) gets no answer, so ESPHome has nothing to warn about.
    - action: screen_message
      supports_response: optional
      variables:
        message: string
      then:
        - lambda: 'id(dashboard_inbox).publish_state(runtime_tiles::receive(message));'
        - if:
            condition:
              lambda: 'return call_id != 0;'
            then:
              - api.respond:
                  data: !lambda |-
                    root["status"] = id(dashboard_inbox).state;
                    root["rev"] = runtime_tiles::layout_rev;
                    root["protocol"] = page_protocol::VERSION;
                    root["bar_values"] = 1;
                    root["appearance_updates"] = 1;
                    // A light group's lamps in its state message (firmware 0.3.9+, app 0.3.16+).
                    root["group_lamps"] = 1;
                    // Tiles without a place of their own, the keys of a bedside clock (firmware 0.8.0+, app 0.4.12+).
                    root["tile_keys"] = 1;
                    // One entity on several tiles (firmware 0.16.0+, app 0.4.26+).
                    root["tile_repeats"] = 1;
                    // Every page on every grid, whatever its cells (firmware 0.18.0+, app 0.4.30+): at most 64 tiles over
                    // eight pages then, or what this board states (below).
                    root["free_pages"] = 1;
                    // This screen's own ceilings (firmware 0.34.0+, app 0.4.57+): the most tiles and pages its board takes
                    // (page_protocol.h). An app that knows nothing of them keeps to 64 and eight. The tiles are the board's,
                    // not those of the grid in use (firmware 0.53.0+): ESP Screens may give it another grid, and counts
                    // the pages times the cells of that one itself (core.Grid.max_tiles).
                    root["max_tiles"] = runtime_tiles::TILES_MAX;
                    root["max_pages"] = runtime_tiles::grid.pages();
                    root["max_bar_items"] = header_bar::MAX_ITEMS;
                    // The grids this screen takes, each way its glass hangs, the one it keeps for each, and which way it
                    // hangs now (firmware 0.53.0+): ESP Screens may send another grid with a layout ("grid" in begin).
                    {
                      auto grids = root["grids"].to<JsonObject>();
                      grids["upright"] = runtime_tiles::canvas_upright;
                      for (int i = 0; i < 2; ++i) {
                        auto way = grids[i ? "portrait" : "landscape"].to<JsonObject>();
                        const auto &range = runtime_tiles::GRID_RANGES[i];
                        way["columns"] = runtime_tiles::chosen_grids[i].columns;
                        way["rows"] = runtime_tiles::chosen_grids[i].rows;
                        auto least = way["min"].to<JsonArray>();
                        least.add(range.min_columns);
                        least.add(range.min_rows);
                        auto most = way["max"].to<JsonArray>();
                        most.add(range.max_columns);
                        most.add(range.max_rows);
                      }
                    }
                    // The memory its tiles may take, what they take now, and what the tile catalogue's prices need from
                    // this board to price a tile (tile_memory.h): whether it has PSRAM, the size of a tile and of its block
                    // of extras. In the reply to a hello or a ping: the app shows how full the screen is and refuses a
                    // layout that would not fit.
                    // The room only once it is known (firmware 0.51.0): a layout has to settle first, and an app reads an
                    // answer without it as a screen that is still measuring. A screen that had to turn a layout down
                    // says the room it has this moment.
                    if (runtime_tiles::reply_memory) {
                      const uint32_t now = esphome::millis();
                      const auto board = runtime_tiles::memory_board();
                      auto memory = root["memory"].to<JsonObject>();
                      if (runtime_tiles::memory_known(now)) memory["room"] = runtime_tiles::memory_room(now);
                      else if (runtime_tiles::memory_short(now)) memory["room"] = runtime_tiles::memory_room_now();
                      memory["used"] = runtime_tiles::layout_cost();
                      memory["psram"] = board.psram;
                      memory["tile"] = board.tile_bytes;
                      memory["extra"] = board.extra_bytes;
                      memory["page"] = board.page_bytes;
                      if (runtime_tiles::memory_short(now)) memory["short"] = 1;
                    }
                    // What this firmware takes beyond the flags above, as a list (firmware 0.19.0+, app 0.4.32+): a newer
                    // option adds its name here. climate_range: a thermostat's range on its -/+, with the chip for its end.
                    auto features = root["features"].to<JsonArray>();
                    features.add("climate_range");
                    // media_library (firmware 0.24.0+, app 0.4.42+): a player's speaker menu, shuffle, repeat, seek, its
                    // cover's colours as the card's ground, and its library with covers and a tap that plays.
                    features.add("media_library");
                    // screensaver (firmware 0.29.0+, app 0.4.48): the op "saver", what to show in standby instead of the dimmed tiles.
                    features.add("screensaver");
                    // saver_keys (firmware 0.33.0+, app 0.4.55): a player's screensaver has keys, so the app also names
                    // a paused player and sends its state and what it can do.
                    features.add("saver_keys");
                    // saver_items (firmware 0.50.0+, app 0.4.81): the clock's row of entities, `wi` of the op "saver".
                    features.add("saver_items");
                    // saver_photos (app 0.4.89): the screensaver's photos step, a folder of Home Assistant's media, one photo
                    // after the other over the whole glass. Only a board that draws pictures shows them.
                    if (runtime_tiles::camera_supported()) features.add("saver_photos");
                    // speaker_groups (firmware 0.26.0+, app speakers.py): a player's speakers with a key to join or leave
                    // the group and each one's volume, its inputs behind a key of their own, and the speaker it follows.
                    features.add("speaker_groups");
                    // bar_status (firmware 0.38.0, app 0.4.63): the top bar's own items, Wi-Fi ("wifi") and the link to
                    // Home Assistant and Tessera ("link"), which the screen reads itself.
                    features.add("bar_status");
                    // battery (firmware 0.41.0): this screen has a battery sensor (runtime_tiles::find_battery), so the
                    // top bar can show it; a screen without one never says so, and ESP Screens does not offer the item.
                    if (battery_status::level) features.add("battery");
                    // plugins (docs/PLUGINS.md): this firmware takes plugin tiles and a plugin's item in the top bar.
                    // plugin_api and plugins say which API it offers and which plugins are built in, with their tile
                    // types (plugin_host::hello).
                    features.add("plugins");
                    plugin_host::hello(root);
                    // caps (hw.h, docs/PLATFORM_PLAN.md 3.3): what this screen's hardware can do, in one record: live
                    // video, speaker, microphone, echo cancellation, a camera of its own, the live tiles it runs at
                    // once, its memory. ESP Screens reads it where it reads a screen's features; the features "live"
                    // and "doorbell" below stay for an app that reads only those.
                    hw::hello(root);
                    // weather_week: the weather card draws the week (weather_chart.h), so ESP Screens sends seven days
                    // with their weekday, the next 48 hours with their hour, and the wind's bearing, the air pressure,
                    // the visibility and the rain's unit.
                    features.add("weather_week");
                    // calendar_detail: a calendar card takes short events (calendar_feed.compact) and keeps 48 without PSRAM;
                    // a tap on one asks for its whole title, place and notes (esphome.screen_calendar, op "calendar_event").
                    features.add("calendar_detail");
                    // live: a P4 that streams (live_view.h): a camera tile set to Live gets pace 0 and streams on the
                    // glass, and ESP Screens makes Live the default for camera tiles here.
                    if (live_view::available()) features.add("live");
                    // pictures (docs/PICTURES.md): this screen asks for every picture as one question (picture_question.h)
                    // once the app's hello says it reads them, and the fields an older app reads until then.
                    if (runtime_tiles::camera_supported()) features.add("pictures");
                    // bar_cards (firmware 0.56.0): an entity's item in the top bar opens its tile's card (hold_card), so ESP
                    // Screens names that tile in the item (`d`) and sends a tile without a cell for an entity on no tile.
                    features.add("bar_cards");
                    // clock_faces (module clock_faces, tier full): the screensaver's clock draws Glass, Classic and Bauhaus,
                    // so ESP Screens sends the face chosen for it (`cf` of the op "saver").
                    #ifdef SD_MOD_CLOCK_FACES
                    features.add("clock_faces");
                    #endif
                    // vacuum_card (module vacuum, tier full): the vacuum card draws its map, rooms and routines, so ESP
                    // Screens sends them (the `vc` block, screen_manager/app/vacuum_card.py).
                    // doorbell (module doorbell, docs/DOORBELL.md): a ring of a doorbell in Home Assistant opens its camera here,
                    // live with its sound and a chime, so ESP Screens sends this screen the op "doorbell". Only a screen that
                    // streams (a P4, live_view.h): elsewhere the camera's picture would be a still.
                    #ifdef SD_MOD_DOORBELL
                    if (live_view::available()) features.add("doorbell");
                    #endif
                    #ifdef SD_MOD_VACUUM_CARD
                    features.add("vacuum_card");
                    // vacuum_tile: a larger vacuum tile draws its map, its rooms or its routines beside its keys
                    // (module_vacuum_tile.cpp), so ESP Screens sends those controls; any other screen gets the keys.
                    features.add("vacuum_tile");
                    #endif
                    // cover_rows (firmware 0.57.0): a cover card lays out what its room holds (cover_tile.h), so ESP
                    // Screens sends a card one row high its slats and a 1x1 card its control, which it draws when they fit.
                    features.add("cover_rows");
                    // media_rows: a taller player card draws its volume over its playback keys (volume_playback), so
                    // ESP Screens sends the pair; an older screen gets the keys.
                    features.add("media_rows");
                    // group_covers (firmware 0.57.0, module cover_groups): a cover group's card has a key to the group's page, one card per
                    // cover, so ESP Screens sends a cover group's covers (`covers`, cover_groups.py) with its state.
                    #ifdef SD_MOD_COVER_GROUPS
                    features.add("group_covers");
                    #endif
                    // text_card (firmware 0.58.0, module text_card, docs/TEXT_TILE.md): the template tile draws the rows Home
                    // Assistant rendered, so ESP Screens offers it and sends its rows (`md`); its caps say how many and how much.
                    #ifdef SD_MOD_TEXT_CARD
                    features.add("text_card");
                    #endif
                    // light_presets (module light_presets, docs/LIGHT_PRESETS.md): a light's tile and card draw the round keys of
                    // its presets, so ESP Screens sends the controls presets and brightness_presets; another screen gets the slider.
                    #ifdef SD_MOD_LIGHT_PRESETS
                    features.add("light_presets");
                    #endif
                    auto sizes = root["tile_sizes"].to<JsonArray>();
                    for (const auto &size : page_protocol::TILE_SIZES)
                      if (size.fits(runtime_tiles::grid.columns, runtime_tiles::grid.rows)) sizes.add(size.name);
                    // Every other rectangle smaller than the grid, as "CxR" (firmware 0.19.0, app 0.4.32+).
                    for (unsigned c = 1; c <= runtime_tiles::grid.columns; ++c)
                      for (unsigned r = 1; r <= runtime_tiles::grid.rows; ++r)
                        if (page_protocol::span_offered(c, r, runtime_tiles::grid.columns, runtime_tiles::grid.rows)) {
                          const char span[4] = {static_cast<char>('0' + c), 'x', static_cast<char>('0' + r), 0};
                          sizes.add(std::string(span));  // copied: the array is gone after this line
                        }
                    root["request"] = runtime_tiles::protocol_key(runtime_tiles::transfer.hello_id);
                    root["session"] = runtime_tiles::protocol_key(runtime_tiles::transfer.lease);
                    root["seq"] = runtime_tiles::transfer.sequence;
                    root["applied"] = runtime_tiles::transfer.active && runtime_tiles::model.ready();
                    // Read-only navigation diagnostics, no additional stored state.
                    root["page"] = runtime_tiles::shown_page ? *runtime_tiles::shown_page + 1 : 0;
                    root["home"] = runtime_tiles::model.page_data.home + 1;
                    root["pagination_count"] = runtime_tiles::model.page_data.count();

interval:
  - interval: 250ms
    then:
      - lambda: |-
          runtime_tiles::tick();
          plugin_host::tick(millis(), id(display_dimmed));
          screen_hooks::run_tick(millis());
  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              if (!screen_settings::current.standby_enabled) return false;
              if (id(display_dimmed) || id(touch_down) || id(calibration_active) || id(alert_active)) return false;
              // A doorbell's ring on the glass (module doorbell) stays lit until it closes.
              if (runtime_tiles::doorbell_holds()) return false;
              return (millis() - id(last_touch_ms)) > (screen_settings::current.standby_seconds * 1000UL);
          then:
            - script.execute: dim_display
      - script.execute: back_to_page_1_when_due
      # A page Home Assistant asked for while the pages were being prepared (show_page) opens once they are ready.
      - lambda: |-
          if (runtime_tiles::wanted_page > 0 && runtime_tiles::navigation_ready()) {
            const int page = runtime_tiles::wanted_page;
            runtime_tiles::wanted_page = 0;
            id(open_page).execute(page);
          }

time:
  - platform: homeassistant
    id: homeassistant_time
    # Refresh immediately on time sync; do not wait for an HA entity update.
    update_interval: 60s
    on_time_sync:
      then:
        # Only the time moved on: the night hours, and the cards that show the time (a kept page's once it is back,
        # firmware 0.3.2+), never every card.
        - script.execute:
            id: apply_screen_settings
            minute: true
    on_time:
      - seconds: 0
        minutes: /1
        then:
          - script.execute:
              id: apply_screen_settings
              minute: true

globals:
  # Alert overlay (HA action show_alert): standby waits while one is up.
  - id: alert_active
    type: bool
    initial_value: 'false'
  - id: alert_title_text
    type: std::string
  # The alert's colour as the automation named it (a swatch's light value, 0 for the normal card).
  - id: alert_card_color
    type: uint32_t
    initial_value: '0'
  - id: alert_timeout_seconds
    type: int
    initial_value: '0'
  - id: alert_flash_requested
    type: bool
    initial_value: 'false'
  - id: rendered_frames
    type: uint32_t
    initial_value: '0'
  - id: calibration_active
    type: bool
    initial_value: 'false'
  - id: tile_page
    type: int
    initial_value: '0'
  - id: touch_down
    type: bool
    initial_value: 'false'



  # Two clocks. last_touch_ms is the standby time: a touch, Wake, an alert ending and Auto standby on restart it.
  # last_use_ms is Back to page 1 (firmware 0.2.56+): only a touch, or Home Assistant opening the settings page.
  - id: last_touch_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: last_use_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # Debounce for do_tile_action: this resistive XPT2046 panel sometimes gives
  # multiple separate press/release cycles for one physical touch (noise in
  # the resistive layer), causing the same HA action to fire multiple times
  # within a few hundred ms (observed: script.ambient_morning 6x in 8s).
  - id: last_action_entity
    type: std::string
    restore_value: no

  - id: last_action_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: display_dimmed
    type: bool
    restore_value: no
    initial_value: 'false'

  # Sleep from Home Assistant (0.2.45+): standby that also holds with Auto standby off,
  # until a tap, Wake or an alert wakes the screen.
  - id: sleep_requested
    type: bool
    restore_value: no
    initial_value: 'false'


# The Tessera mark on the starting screen (firmware 0.3.8+), fonts/tessera-mark.png rendered from the website's
# tessera-mark.svg; ESPHome scales it to the look's size when it builds. The top-level form that ESPHome 2026.6.2
# (min_version) knows; 2026.7+ reads it as `platform: file`.
image:
  - id: tessera_mark
    file: "${FONT_DIR}/tessera-mark.png"
    type: RGB565
    transparency: alpha_channel
    resize: ${BRAND_MARK_SIZE}x${BRAND_MARK_SIZE}
  # The home key at the far left of the top bar (firmware 0.10.0+): the same mark as tall as the house that stood there
  # before, a house of Material Design Icons at FONT_ICON_HOME_SIZE (17 of its 24 units), about a kilobyte per board.
  - id: tessera_mark_bar
    file: "${FONT_DIR}/tessera-mark.png"
    type: RGB565
    transparency: alpha_channel
    resize: ${ ((FONT_ICON_HOME_SIZE | int) * 17 / 24) | round | int }x${ ((FONT_ICON_HOME_SIZE | int) * 17 / 24) | round | int }

font:
